{% extends "panel_admin/base_dashboard.html" %}
{% block title %}Panel de Administración — Cueromania{% endblock %}
{% block content %}
<h1 class="panel-title-main">Panel de Administración</h1>
<div class="row justify-content-center g-4">
    <div class="col-sm-5 col-md-5 col-lg-3">
        <a href="{% url 'panel_usuarios' %}" class="card card-option text-decoration-none">
            <div class="card-body">
                <img src="https://img.icons8.com/ios-filled/50/groups.png" alt="">
                <span>Gestionar Usuarios</span>
            </div>
        </a>
    </div>
    <div class="col-sm-5 col-md-5 col-lg-3">
        <a href="{% url 'panel_productos' %}" class="card card-option text-decoration-none">
            <div class="card-body">
                <img src="https://img.icons8.com/ios-filled/50/box.png" alt="">
                <span>Gestionar Productos</span>
            </div>
        </a>
    </div>
    <div class="col-sm-5 col-md-5 col-lg-3">
        <a href="{% url 'panel_personalizacion' %}" class="card card-option text-decoration-none">
            <div class="card-body">
                <img src="https://img.icons8.com/ios-filled/50/paint-palette.png" alt="">
                <span>Gestionar Personalización</span>
            </div>
        </a>
    </div>
    <div class="col-sm-6 col-md-4 col-lg-3">
        <a href="{% url 'panel_ventas' %}" class="card card-option text-decoration-none">
            <div class="card-body">
                <img src="https://img.icons8.com/ios-filled/50/shopping-cart.png" alt="">
                <span>Gestionar Ventas</span>
            </div>
        </a>
    </div>
    <div class="col-sm-6 col-md-4 col-lg-3">
        <a href="{% url 'panel_pagos' %}" class="card card-option text-decoration-none">
            <div class="card-body">
                <img src="https://img.icons8.com/ios-filled/50/money-transfer.png" alt="">
                <span>Gestionar Pagos</span>
            </div>
        </a>
    </div>
</div>
{% endblock %}
