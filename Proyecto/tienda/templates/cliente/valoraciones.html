{% extends "cliente/cliente.html" %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg border-0" style="border-radius: 20px;">
                <div class="card-body p-5">
                    <h2 class="fw-bold mb-4 text-center">Valorar Producto</h2>
                    
                    <div class="text-center mb-4">
                        {% if producto.imagen %}
                            <img src="{{ producto.imagen.url }}" width="120" class="rounded shadow-sm mb-2">
                        {% endif %}
                        <h4 class="fw-bold">{{ producto.nombre }}</h4>
                    </div>

                    <form method="POST" action="." enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-4 text-center">
                            <label class="form-label fw-bold d-block">¿Qué puntuación le das?</label>
                            <select name="valor_puntuacion" class="form-select form-select-lg" required>
                                <option value="">Selecciona estrellas...</option>
                                <option value="5">⭐⭐⭐⭐⭐ (Excelente)</option>
                                <option value="4">⭐⭐⭐⭐ (Muy bueno)</option>
                                <option value="3">⭐⭐⭐ (Bueno)</option>
                                <option value="2">⭐⭐ (Regular)</option>
                                <option value="1">⭐ (Malo)</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="comentario" class="form-label fw-bold">Tu opinión</label>
                            <textarea class="form-control" name="comentario" rows="3" placeholder="Escribe aquí tu reseña..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Sube una foto de tu producto (Opcional)</label>
                            <input type="file" name="foto_valoracion" class="form-control" accept="image/*">
                            <small class="text-muted">Muestra cómo te quedó tu artículo de cuero.</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark btn-lg">Enviar Valoración</button>
                            
                            <a href="{% url 'cliente' %}" class="btn btn-outline-secondary">Volver al Inicio</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
