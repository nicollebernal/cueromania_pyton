<!DOCTYPE html>
<html lang="es">
<head>

    <title>¡Listo! - Cueromanía</title>

    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">

</head>
<body>

<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">

    <div class="card p-4 text-center shadow" style="width:100%; max-width:520px; border-radius:15px;">

        <a href="{% url 'login' %}" class="btn btn-primary w-100 mt-3">
            Iniciar Sesión ahora
        </a>
    </div>
</div>
