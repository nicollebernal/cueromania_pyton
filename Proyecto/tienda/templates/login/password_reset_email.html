<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña | Cueromanía</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo-primario: #5a0f14;
            --rojo-vibrante: #8b1c24;
            --blanco-puro: #ffffff;
            --gris-suave: #f8fafc;
            --texto-deep: #0f172a;
        }
        body {
            background-color: var(--gris-suave);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--blanco-puro);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(90, 15, 20, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 3.5rem;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .btn-compra-lujo {
            background-color: #8b1c24;
            color: white;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-compra-lujo:hover {
            background-color: #5a0f14;
            color: white;
        }
        .input-group-modern input {
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 16px;
            font-size: 1rem;
        }
        .input-group-modern input:focus {
            background: var(--blanco-puro);
            border-color: var(--rojo-vibrante);
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h2 class="fw-bold mb-2">Recuperar Contraseña</h2>
    <p class="text-muted mb-4">Ingresa tu correo para recibir instrucciones de recuperación</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} text-start" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="text-start">
        {% csrf_token %}
        
        <div class="mb-3">
            <label class="form-label small fw-bold">Correo Electrónico</label>
            <input type="email" class="form-control input-group-modern" name="email" placeholder="tu@email.com" required>
        </div>

        <button type="submit" class="btn btn-compra-lujo w-100 py-3 mt-4">
            Enviar Instrucciones
        </button>
    </form>

    <div class="text-center mt-4">
        <p class="mb-0">¿Recuerdas tu contraseña? <a href="{% url 'login' %}" class="fw-bold text-danger" style="text-decoration: none;">Inicia sesión</a></p>
    </div>
</div>

</body>
</html>
