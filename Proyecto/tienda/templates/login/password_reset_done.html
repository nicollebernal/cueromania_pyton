<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo Enviado - Cueromanía</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/miapp.css' %}">
</head>
<body>

<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">
    
    <img src="{% static 'img/logo.jpeg' %}" alt="Logo" class="mb-3" style="width:120px;">

    <div class="card p-4 text-center" style="width:100%; max-width:520px; border-radius:15px;">
        <h3 class="mb-3">¡Correo enviado!</h3>
        <p>Te hemos enviado instrucciones para restablecer tu contraseña a tu email.</p>
        <p class="text-muted small">Si no lo recibes, revisa tu carpeta de spam o verifica si el correo está bien escrito.</p>
        
        <a href="{% url 'login' %}" class="btn btn-primary mt-3">
            Volver al Login
        </a>
    </div>
</div>

</body>
</html>
