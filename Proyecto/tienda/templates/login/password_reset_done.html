<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo Enviado - Cueromanía</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo-primario: #5a0f14;
            --rojo-vibrante: #8b1c24;
            --blanco-puro: #ffffff;
            --gris-suave: #f8fafc;
        }
        body {
            background-color: var(--gris-suave);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--blanco-puro);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(90, 15, 20, 0.15);
            width: 100%;
            max-width: 500px;
            padding: 3.5rem;
            border: 1px solid rgba(0,0,0,0.03);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#8b1c24" viewBox="0 0 16 16" class="mx-auto">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
            <path d="m10.97 4.97-.02.02-3.6 3.85-1.74-1.885a.5.5 0 0 0-.712.712l2.55 2.75a.5.5 0 0 0 .74-.037l4.005-4.287a.5.5 0 0 0-.738-.847z"/>
        </svg>
    </div>

    <h2 class="fw-bold mb-2">¡Correo Enviado!</h2>
    <p class="text-muted mb-3">Te hemos enviado instrucciones para recuperar tu contraseña a tu email.</p>
    <p class="text-muted small">Si no recibes el correo en los próximos minutos, verifica tu carpeta de spam u otra carpeta de filtrado.</p>
    
    <hr class="my-4">
    <p class="small text-muted mb-0">¿No funciona el enlace? <a href="{% url 'password_reset' %}" class="fw-bold text-danger" style="text-decoration: none;">Intenta de nuevo</a></p>
    
    <a href="{% url 'login' %}" class="btn btn-light border mt-4">
        Volver al Login
    </a>
</div>

</body>
</html>
