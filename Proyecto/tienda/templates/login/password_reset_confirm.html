<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña - Cueromanía</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --rojo-primario: #5a0f14;
            --rojo-vibrante: #8b1c24;
            --blanco-puro: #ffffff;
            --gris-suave: #f8fafc;
            --texto-deep: #0f172a;
        }
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: var(--blanco-puro);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(90, 15, 20, 0.15);
            width: 100%;
            max-width: 520px;
            padding: 3.5rem;
            border: 1px solid rgba(0,0,0,0.03);
        }
        .login-card h2 {
            color: var(--rojo-primario);
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .login-card .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .form-label {
            color: var(--texto-deep);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.7rem;
        }
        .input-group-modern input {
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 0.875rem 1.25rem;
            font-size: 1rem;
            color: var(--texto-deep);
            transition: all 0.3s ease;
        }
        .input-group-modern input:focus {
            background: var(--blanco-puro);
            border-color: var(--rojo-vibrante);
            box-shadow: 0 0 0 3px rgba(139, 28, 36, 0.1);
            outline: none;
        }
        .input-group-modern input::placeholder {
            color: #94a3b8;
        }
        .btn-compra-lujo {
            background-color: var(--rojo-vibrante);
            color: var(--blanco-puro);
            font-weight: 700;
            border-radius: 12px;
            padding: 0.875rem 2rem;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(139, 28, 36, 0.2);
        }
        .btn-compra-lujo:hover {
            background-color: var(--rojo-primario);
            color: var(--blanco-puro);
            box-shadow: 0 15px 35px rgba(90, 15, 20, 0.3);
            transform: translateY(-2px);
        }
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
            padding: 1rem;
            font-size: 0.95rem;
        }
        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .alert-success {
            background-color: #dcfce7;
            color: #166534;
        }
        .form-divider {
            text-align: center;
            color: #cbd5e1;
            font-size: 0.85rem;
            margin: 1.5rem 0;
            font-weight: 500;
        }
        .text-link {
            color: var(--rojo-vibrante);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .text-link:hover {
            color: var(--rojo-primario);
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="text-center">Cambiar Contraseña</h2>
    <p class="subtitle text-center">Introduce tu contraseña actual y crea una nueva contraseña segura</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" role="alert">
                <strong>{{ message }}</strong>
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="text-start">
        {% csrf_token %}
        
        
        <div class="mb-3">
            <label class="form-label">Contraseña Actual</label>
            <div class="input-group-modern">
                <input type="password" class="form-control" name="clave_vieja" placeholder="Ingresa tu contraseña actual" required>
            </div>
        </div>

        <div class="form-divider">Nueva Contraseña</div>

       
        <div class="mb-3">
            <label class="form-label">Nueva Contraseña</label>
            <div class="input-group-modern">
                <input type="password" class="form-control" name="clave_nueva" placeholder="Mínimo 6 caracteres" required>
            </div>
        </div>

       
        <div class="mb-4">
            <label class="form-label">Confirmar Nueva Contraseña</label>
            <div class="input-group-modern">
                <input type="password" class="form-control" name="clave_confirmar" placeholder="Repite tu nueva contraseña" required>
            </div>
        </div>

        <button type="submit" class="btn btn-compra-lujo w-100 py-3">
            ✓ Guardar Cambios
        </button>
    </form>

    <div class="text-center mt-4">
        <p class="mb-0">
            <a href="{% url 'login' %}" class="text-link">← Volver al Login</a>
        </p>
    </div>
</div>

</body>
</html>
