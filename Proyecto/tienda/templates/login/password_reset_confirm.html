<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña - Cueromanía</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/miapp.css' %}">
</head>
<body>

<div class="container d-flex flex-column justify-content-center align-items-center" style="min-height:100vh;">
    
    <img src="{% static 'img/logo.jpeg' %}" alt="Logo" class="mb-3" style="width:120px;">

    <div class="card p-4 shadow" style="width:100%; max-width:520px; border-radius:15px;">
        <h3 class="text-center mb-4">Crea tu nueva contraseña</h3>
        
        {% if validlink %}
            <p class="text-muted text-center">Introduce tu nueva contraseña dos veces para confirmar.</p>
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="btn btn-danger w-100 mt-3">
                    Guardar nueva contraseña
                </button>
            </form>
        {% else %}
            <div class="alert alert-danger text-center">
                <strong>¡Enlace no válido!</strong><br>
                El enlace de recuperación es inválido o ya ha caducado.
            </div>
            <a href="{% url 'password_reset' %}" class="btn btn-primary w-100">
                Solicitar un nuevo enlace
            </a>
        {% endif %}
    </div>
</div>

</body>
</html>
