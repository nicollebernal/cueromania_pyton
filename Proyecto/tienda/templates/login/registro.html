<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --rojo-primario: #5a0f14;
            --rojo-vibrante: #8b1c24;
            --blanco-puro: #ffffff;
            --gris-suave: #f8fafc;
            --texto-deep: #0f172a;
        }

        body {
            background-color: var(--gris-suave);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 28, 36, 0.05), transparent 50%),
                radial-gradient(at 100% 100%, rgba(90, 15, 20, 0.05), transparent 50%);
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--blanco-puro);
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(90, 15, 20, 0.15);
            width: 100%;
            max-width: 600px;
            padding: 3rem;
            border: 1px solid rgba(0,0,0,0.03);
        }

        h3 {
            font-weight: 800;
            color: var(--rojo-primario);
            text-align: center;
            margin-bottom: 5px;
        }

        .welcome-text {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        .input-group-modern {
            position: relative;
            margin-bottom: 1.2rem;
        }

        .input-group-modern input {
            width: 100%;
            background: #f1f5f9;
            border: 2px solid transparent;
            border-radius: 14px;
            padding: 14px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .input-group-modern input:focus {
            background: white;
            border-color: var(--rojo-vibrante);
            box-shadow: 0 10px 20px -10px rgba(139, 28, 36, 0.2);
            outline: none;
        }

        .btn-impact {
            width: 100%;
            background: linear-gradient(135deg, var(--rojo-primario), var(--rojo-vibrante));
            color: white;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-weight: 700;
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-impact:hover {
            transform: translateY(-3px);
        }

        .link-login {
            color: var(--rojo-primario);
            font-weight: 700;
            text-decoration: none;
            margin-left: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(90, 15, 20, 0.08);
            transition: 0.3s;
        }

        .link-login:hover {
            background: var(--rojo-primario);
            color: white;
        }
    </style>
</head>

<body>

<div class="login-card">
    <h3>Únete a Cueromanía</h3>
    <p class="welcome-text">Crea tu cuenta en pocos pasos</p>

    <form method="post" action="{% url 'registrar_usuario' %}">
        {% csrf_token %}

        <div class="row">
            <div class="col-md-6 input-group-modern">
                <input type="text" name="id_usuario" placeholder="Cédula" required>
            </div>
            <div class="col-md-6 input-group-modern">
                <input type="text" name="contacto" placeholder="Teléfono de contacto">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 input-group-modern">
                <input type="text" name="primer_nombre" placeholder="Primer nombre" required>
            </div>
            <div class="col-md-6 input-group-modern">
                <input type="text" name="segundo_nombre" placeholder="Segundo nombre">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 input-group-modern">
                <input type="text" name="primer_apellido" placeholder="Primer apellido" required>
            </div>
            <div class="col-md-6 input-group-modern">
                <input type="text" name="segundo_apellido" placeholder="Segundo apellido">
            </div>
        </div>

        <div class="input-group-modern">
            <input type="text" name="direccion" placeholder="Dirección">
        </div>

        <div class="input-group-modern">
            <input type="email" name="gmail" placeholder="Correo electrónico" required>
        </div>

        <div class="input-group-modern">
            <input type="password" name="clave" placeholder="Contraseña" required>
        </div>

        <button type="submit" class="btn-impact">
            Registrarse
        </button>

        
        <div class="text-center mt-3">
            <span style="color:#64748b; font-size:0.9rem;">
                ¿Ya tienes contraseña?
            </span>
            <a href="{% url 'login' %}" class="link-login">
                Iniciar sesión
            </a>
        </div>

    </form>
</div>

</body>
</html>
