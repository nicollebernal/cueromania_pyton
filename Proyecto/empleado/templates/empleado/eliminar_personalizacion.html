<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Personalización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow-sm">
        <h3>¿Eliminar personalización?</h3>
        <p>Vas a eliminar la personalización: <strong>{{ personalizacion.descripcion|truncatewords:5 }}</strong></p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'pedidos_personalizados' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>

</body>
</html>
