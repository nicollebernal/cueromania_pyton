<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Producto - Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Crear Nuevo Producto</h4>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Nombre del Producto *</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Precio *</label>
                                <input type="number" class="form-control" name="precio" step="0.01" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock Inicial *</label>
                                <input type="number" class="form-control" name="stock_producto" min="0" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Talla *</label>
                                <input type="text" class="form-control" name="talla" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Estado *</label>
                                <select class="form-control" name="estado" required>
                                    <option value="disponible">Disponible</option>
                                    <option value="agotado">Agotado</option>
                                    <option value="descontinuado">Descontinuado</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Marca *</label>
                                <select class="form-control" name="id_marca" required>
                                    <option>Seleccione una marca</option>
                                    {% for marca in marcas %}
                                        <option value="{{ marca.id_marca }}">{{ marca.nombre_marca }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Categoría *</label>
                                <select class="form-control" name="id_categoria" required>
                                    <option>Seleccione una categoría</option>
                                    {% for cat in categorias %}
                                        <option value="{{ cat.id_categoria }}">{{ cat.nombre_categoria }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Género *</label>
                                <select class="form-control" name="id_genero" required>
                                    <option>Seleccione un género</option>
                                    {% for gen in generos %}
                                        <option value="{{ gen.id_genero }}">{{ gen.nombre_genero }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Color *</label>
                                <select class="form-control" name="id_color" required>
                                    <option>Seleccione un color</option>
                                    {% for col in colores %}
                                        <option value="{{ col.id_color }}">{{ col.nombre_color }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Tipo de Cierre *</label>
                            <select class="form-control" name="id_tipo_cierre" required>
                                <option>Seleccione un tipo de cierre</option>
                                {% for cierre in tipos_cierres %}
                                    <option value="{{ cierre.id_tipo_cierre }}">{{ cierre.tipo_cierre }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" name="descripcion" rows="4"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagen del Producto</label>
                            <input type="file" class="form-control" name="imagen" accept="image/*">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar Producto</button>
                            <a href="{% url 'inventario_empleado' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
