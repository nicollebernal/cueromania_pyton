<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Personalización</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-warning text-white">
                    <h4 class="mb-0">Editar Personalización</h4>
                </div>
                <div class="card-body">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Descripción *</label>
                            <textarea class="form-control" name="descripcion" rows="4" required>{{ personalizacion.descripcion }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Categoría *</label>
                                <select class="form-control" name="id_categoria" required>
                                    {% for cat in categorias %}
                                        <option value="{{ cat.id_categoria }}" 
                                            {% if cat.id_categoria == personalizacion.id_categoria_id %}selected{% endif %}>
                                            {{ cat.nombre_categoria }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Marca *</label>
                                <select class="form-control" name="id_marca" required>
                                    {% for marc in marcas %}
                                        <option value="{{ marc.id_marca }}" 
                                            {% if marc.id_marca == personalizacion.id_marca_id %}selected{% endif %}>
                                            {{ marc.nombre_marca }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Color *</label>
                                <select class="form-control" name="id_color" required>
                                    {% for col in colores %}
                                        <option value="{{ col.id_color }}" 
                                            {% if col.id_color == personalizacion.id_color_id %}selected{% endif %}>
                                            {{ col.nombre_color }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Género *</label>
                                <select class="form-control" name="id_genero" required>
                                    {% for gen in generos %}
                                        <option value="{{ gen.id_genero }}" 
                                            {% if gen.id_genero == personalizacion.id_genero_id %}selected{% endif %}>
                                            {{ gen.nombre_genero }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Imagen de Personalización</label>
                            {% if personalizacion.imagen_personalizacion %}
                                <div class="mb-2">
                                    <img src="{{ personalizacion.imagen_personalizacion.url }}" width="150" height="150" style="object-fit: cover; border-radius: 5px;">
                                </div>
                                <p class="text-muted">Imagen actual</p>
                            {% endif %}
                            <input type="file" class="form-control" name="imagen_personalizacion" accept="image/*">
                            <small class="text-muted">Carga una nueva imagen para reemplazar</small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-warning">Guardar Cambios</button>
                            <a href="{% url 'pedidos_personalizados' %}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
