<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4 text-center">
        <h2 class="mb-3">Panel Principal del Empleado</h2>
        <p class="mb-4">
            Bienvenido, <strong>{{ usuario.primer_nombre }} {{ usuario.primer_apellido }}</strong>
        </p>

        <div class="d-grid gap-3 col-md-6 mx-auto">
            <a href="{% url 'inventario_empleado' %}" class="btn btn-primary btn-lg">
                 Inventario
            </a>

            <a href="{% url 'ventas_empleado' %}" class="btn btn-success btn-lg">
                 Ventas Presenciales
            </a>

            <a href="{% url 'pedidos_personalizados' %}" class="btn btn-warning btn-lg">
                 Pedidos de Personalización
            </a>

            <a href="{% url 'login' %}" class="btn btn-danger btn-lg">
                    Cerrar Sesión
            </a>
        </div>
    </div>
</div>

</body>
</html>
